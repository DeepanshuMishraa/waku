[package]
name = "insulator-daemon"
version = "0.1.0"
edition = "2024"
description = "Headless Insulator provider daemon"
license = "GPL-3.0-only"
readme = "README.md"

[features]
dev-binary = []

[[bin]]
name = "insulator-daemon"
path = "src/main.rs"

[[bin]]
name = "insulator-debug-daemon"
path = "src/bin/insulator-debug-daemon.rs"
required-features = ["dev-binary"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
insulator-core = { path = "../insulator-core" }
insulator-protocol = { path = "../insulator-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
